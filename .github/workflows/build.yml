name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            preset: linux-release
            build-preset: linux-release
            test-preset: linux-release
            artefacts: build/linux-release/EyraEQ_artefacts/Release
            pluginval-zip: pluginval_Linux.zip
            pluginval-bin: ./pluginval
          - name: macOS Universal
            os: macos-latest
            preset: macos
            build-preset: macos-release
            test-preset: macos-release
            artefacts: build/macos/EyraEQ_artefacts/Release
            pluginval-zip: pluginval_macOS.zip
            pluginval-bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Windows x64
            os: windows-2022
            preset: windows
            build-preset: windows-release
            test-preset: windows-release
            artefacts: build/windows/EyraEQ_artefacts/Release
            pluginval-zip: pluginval_Windows.zip
            pluginval-bin: ./pluginval.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DEYRA_REQUIRE_ONNXRUNTIME=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

      - name: Unit and host tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --preset ${{ matrix.test-preset }}
          else
            ctest --preset ${{ matrix.test-preset }}
          fi

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval-zip }}"
          7z x -y pluginval.zip > /dev/null
          VST3="${{ matrix.artefacts }}/VST3/EyraEQ.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            chmod +x ./pluginval
            xvfb-run -a ${{ matrix.pluginval-bin }} --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3"
          else
            ${{ matrix.pluginval-bin }} --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3"
          fi

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ runner.os }}
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Upload plug-in and standalone (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: EyraEQ-${{ runner.os }}-unsigned
          path: |
            ${{ matrix.artefacts }}/VST3
            ${{ matrix.artefacts }}/Standalone
