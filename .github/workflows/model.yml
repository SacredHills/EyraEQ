name: Build and validate instrument model

# validate: runs instrument recognition with the committed model (Models/yamnet, the one that ships)
#   and the taxonomy on NSynth. Commit message [publish-validation] commits the results
#   (Documentation/Validation) to the branch.
# model: converts Google's YAMNet (Apache-2.0) to ONNX and verifies it against the TensorFlow reference.
#   Runs on manual dispatch or [build-model]; [publish-model] also commits the model to the branch.

on:
  push:
    paths:
      - "Scripts/models/**"
      - "Models/instrument_taxonomy.json"
      - ".github/workflows/model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime==1.20.1 numpy==1.26.4 soundfile

      - name: Validate on NSynth (valid and test splits) with the committed model
        run: |
          python Scripts/models/validate_nsynth.py Models/yamnet Models/instrument_taxonomy.json build-validation 100
          python Scripts/models/tune_thresholds.py build-validation Models/instrument_taxonomy.json --precision 0.9 | tee build-validation/tuning.txt

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: nsynth-validation
          path: build-validation

      - name: Commit the validation data to the branch
        if: contains(github.event.head_commit.message, '[publish-validation]')
        run: |
          mkdir -p Documentation/Validation
          cp build-validation/* Documentation/Validation/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Documentation/Validation
          git commit -m "Validation: NSynth results from CI run ${{ github.run_id }}" \
                     -m "Instrument recognition with the committed model and taxonomy, by Scripts/models/validate_nsynth.py."
          git push

  model:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-model]') || contains(github.event.head_commit.message, '[publish-model]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r Scripts/models/requirements.txt

      - name: Convert YAMNet to ONNX and verify against TensorFlow
        run: python Scripts/models/build_yamnet_onnx.py build-model/yamnet

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: yamnet-model
          path: build-model

      - name: Commit the verified model to the branch
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-model]')
        run: |
          rm -rf Models/yamnet
          cp -r build-model/yamnet Models/yamnet
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Models/yamnet
          git commit -m "Model: YAMNet ONNX built and verified by CI run ${{ github.run_id }}" \
                     -m "Converted from Google's published YAMNet (Apache-2.0) by Scripts/models/build_yamnet_onnx.py and verified against the TensorFlow reference."
          git push
