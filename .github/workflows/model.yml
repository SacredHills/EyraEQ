name: Build and validate instrument model

# Converts Google's YAMNet (Apache-2.0) to ONNX, verifies it against the TensorFlow reference,
# and validates instrument recognition on NSynth. The verified Models/yamnet folder and the
# validation data are uploaded as an artifact and, when requested, committed to the branch.
#
# To publish: run the workflow manually, or push a commit whose message contains [publish-model].

on:
  push:
    paths:
      - "Scripts/models/**"
      - "Models/instrument_taxonomy.json"
      - ".github/workflows/model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r Scripts/models/requirements.txt

      - name: Convert YAMNet to ONNX and verify against TensorFlow
        run: python Scripts/models/build_yamnet_onnx.py build-model/yamnet

      - name: Validate on NSynth (valid and test splits)
        run: python Scripts/models/validate_nsynth.py build-model/yamnet Models/instrument_taxonomy.json build-model/validation 100

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: yamnet-model
          path: build-model

      - name: Commit the verified model and validation data to the branch
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-model]')
        run: |
          rm -rf Models/yamnet
          cp -r build-model/yamnet Models/yamnet
          mkdir -p Documentation/Validation
          cp build-model/validation/* Documentation/Validation/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Models/yamnet Documentation/Validation
          git commit -m "Model: YAMNet ONNX built and verified by CI run ${{ github.run_id }}" \
                     -m "Converted from Google's published YAMNet (Apache-2.0) by Scripts/models/build_yamnet_onnx.py and verified against the TensorFlow reference; NSynth validation data included."
          git push
